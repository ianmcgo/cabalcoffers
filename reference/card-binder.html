<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Card Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
--bg:#e9ecef;--surface:#ffffff;--sunk:#dde2e7;--fg:#14181d;--muted:#59616c;--line:#c9d0d7;--accent:#0f6e66;--accent-ink:#ffffff;--warn:#9a5b00;--sleeve:#14181d;
--f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
--f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
--f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--surface:#181e24;--sunk:#0b0e11;--fg:#e8ecef;--muted:#9aa4ae;--line:#2a333c;--accent:#3cc2b4;--accent-ink:#06201d;--warn:#e7a53c;--sleeve:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--surface:#181e24;--sunk:#0b0e11;--fg:#e8ecef;--muted:#9aa4ae;--line:#2a333c;--accent:#3cc2b4;--accent-ink:#06201d;--warn:#e7a53c;--sleeve:#000000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font:800 clamp(28px,5vw,44px)/1 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;font-variant-numeric:tabular-nums}
.stat{display:grid}
.stat b{font:600 22px/1.1 var(--f-display)}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.import{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.import>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.import>summary::-webkit-details-marker{display:none}
details.import>summary::after{content:"+";font:600 18px/1 var(--f-mono);color:var(--muted)}
details.import[open]>summary::after{content:"\2212"}
.import-body{padding:0 16px 16px;display:grid;gap:12px}
.drop{position:relative}
textarea{width:100%;min-height:140px;resize:vertical;font:13px/1.55 var(--f-mono);background:var(--sunk);color:var(--fg);border:1px dashed var(--line);border-radius:8px;padding:12px}
.drop.over textarea{border-color:var(--accent);outline:2px solid var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input[type=search],.file{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px}
button,.file{cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:hover,.file:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file{position:relative;display:inline-flex;align-items:center}
label.inline{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.toolbar input[type=search]{flex:1 1 200px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.status{font-size:13px;color:var(--muted);min-height:20px;font-variant-numeric:tabular-nums}
.status .bar{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.tile{all:unset;cursor:pointer;display:grid;gap:8px;min-width:0}
.art{position:relative;aspect-ratio:63/88;max-width:100%;border-radius:4.75%/3.4%;background:var(--sleeve);overflow:hidden;box-shadow:0 1px 2px rgb(0 0 0/.25),0 6px 16px -8px rgb(0 0 0/.45);transition:transform .15s}
.tile:hover .art{transform:translateY(-3px)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:6px;border:1px solid rgb(255 255 255/.18);border-radius:3% / 2.2%;display:grid;align-content:space-between;padding:12px;color:#e8ecef;background:repeating-linear-gradient(135deg,transparent 0 10px,rgb(255 255 255/.03) 10px 20px)}
.ph b{font:600 15px/1.2 var(--f-display);overflow-wrap:anywhere}
.ph small{font:500 11px/1.4 var(--f-mono);opacity:.75}
.ph em{font-style:normal;font-size:11px;color:#f2b85b}
.shimmer{position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgb(255 255 255/.08) 50%,transparent 70%);background-size:220% 100%;animation:sh 1.3s infinite linear}
@keyframes sh{to{background-position:-220% 0}}
.qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font:600 12px/1 var(--f-mono);padding:5px 7px;border-radius:999px}
.foil{position:absolute;top:8px;left:8px;background:rgb(0 0 0/.6);color:#fff;font:500 10px/1 var(--f-mono);padding:5px 6px;border-radius:999px;letter-spacing:.06em}
.meta{display:grid;gap:1px;min-width:0}
.nm{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.sub{display:flex;justify-content:space-between;gap:8px;font:500 12px/1.4 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.grid.list{grid-template-columns:1fr;gap:6px}
.grid.list .tile{grid-template-columns:52px minmax(0,1fr);align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 6px}
.grid.list .art{box-shadow:none}
.grid.list .ph{padding:4px;inset:2px}
.grid.list .ph b,.grid.list .ph em{display:none}
.grid.list .ph small{font-size:8px}
.grid.list .qty{top:auto;bottom:3px;right:3px;font-size:10px;padding:3px 5px}
.grid.list .foil{display:none}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--fg);width:min(860px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgb(0 0 0/.6)}
.dlg{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;padding:20px;overflow:auto;max-height:calc(100dvh - 32px)}
@media (max-width:640px){.dlg{grid-template-columns:1fr}}
.dlg .art{width:100%}
.dlg h2{font:800 26px/1.15 var(--f-display);margin:0 0 4px;text-wrap:balance}
.dlg dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:16px 0;font-size:14px}
.dlg dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em;padding-top:2px}
.dlg dd{margin:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.dlg .src{font:500 12px var(--f-mono);color:var(--muted)}
.dlg a{color:var(--accent)}
.x{position:sticky;top:0;float:right}
@media (prefers-reduced-motion:reduce){.shimmer{animation:none}.tile:hover .art{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Card <span>Binder</span></h1>
<div class="stats" id="stats"></div>
</header>

<details class="import" id="importPanel" open>
<summary>Import a TCGplayer export</summary>
<div class="import-body">
<p class="hint">Paste the text export (like <code>1 Transit Mage [DFT] 70</code>) or drop a CSV or TXT file here. CSV exports with a Product ID column get images for every game TCGplayer sells.</p>
<div class="drop" id="drop">
<textarea id="paste" spellcheck="false" aria-label="Export text">1 Transit Mage [DFT] 70
1 Forest (0198) [HOB] 198
1 Fateful Discovery [HOB] 40</textarea>
</div>
<div class="row">
<label class="file">Choose file<input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" multiple></label>
<label class="inline" for="game">Game
<select id="game">
<option value="auto">Detect automatically</option>
<option value="mtg">Magic: The Gathering</option>
<option value="pokemon">Pokémon</option>
<option value="yugioh">Yu-Gi-Oh!</option>
<option value="lorcana">Disney Lorcana</option>
<option value="other">Other (TCGplayer ID only)</option>
</select></label>
<button class="primary" id="replace">Show these cards</button>
<button id="add">Add to collection</button>
<button id="clear">Clear collection</button>
</div>
</div>
</details>

<div class="toolbar">
<input type="search" id="q" placeholder="Search name or set" aria-label="Search">
<select id="fSet" aria-label="Set"><option value="">All sets</option></select>
<select id="fRarity" aria-label="Rarity"><option value="">All rarities</option></select>
<select id="sort" aria-label="Sort">
<option value="set">Set and number</option>
<option value="name">Name</option>
<option value="price">Price, high to low</option>
<option value="qty">Quantity</option>
</select>
<label class="inline"><input type="checkbox" id="missing"> Unmatched only</label>
<div class="seg" role="group" aria-label="View">
<button id="vGrid" aria-pressed="true">Grid</button>
<button id="vList" aria-pressed="false">List</button>
</div>
</div>
<div class="status" id="status"></div>
<div class="grid" id="grid"></div>
</div>

<dialog id="dlg"></dialog>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let items=store.get("binder.items",null);
let cache=store.get("binder.cache",{});
let view=store.get("binder.view","grid");
let progress={done:0,total:0,running:false};
const tiles=new Map();
let saveTimer=null;
function saveCache(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>store.set("binder.cache",cache),400)}

function cleanName(n){return n.replace(/\s*\([^)]*\)/g,"").replace(/\s+/g," ").trim()}
function normNum(n){return n?String(n).trim().replace(/^0+(?=\d)/,""):""}
function lc(s){return(s||"").toLowerCase()}
function gameFromLine(s){s=lc(s);if(!s)return"";if(s.includes("magic"))return"mtg";if(s.includes("pok"))return"pokemon";if(s.includes("yu"))return"yugioh";if(s.includes("lorcana"))return"lorcana";return"other"}

function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}if(f!==""||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()!==""))}

const ALIAS={
qty:["quantity","qty","count","total quantity","add to quantity","amount"],
name:["simple name","name","product name","card name","card","title"],
setCode:["set code","set abbreviation","set abbr","edition code","setcode"],
setName:["set","set name","edition","expansion"],
num:["card number","number","collector number","card no","no","num"],
pid:["product id","productid","tcgplayer id","tcgplayer product id","tcgplayer productid"],
condition:["condition"],
printing:["printing","foil","finish","variant"],
rarity:["rarity"],
price:["tcg market price","market price","tcgplayer market price","price","tcg low price","tcg mid price"],
line:["product line","game","category","productline"]};
function nh(h){return lc(h).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}

function looksCSV(text){const first=text.split(/\r?\n/).find(l=>l.trim())||"";if(!first.includes(","))return false;const hs=first.split(",").map(nh);return hs.some(h=>ALIAS.name.includes(h)||ALIAS.qty.includes(h)||ALIAS.pid.includes(h))}

function fromCSV(text,game){const rows=parseCSV(text);const head=rows.shift().map(nh);const idx={};for(const k in ALIAS){for(const a of ALIAS[k]){const i=head.indexOf(a);if(i>-1){idx[k]=i;break}}}const g=(r,k)=>idx[k]!=null?(r[idx[k]]||"").trim():"";const out=[];for(const r of rows){const name=g(r,"name");if(!name)continue;const sc=g(r,"setCode");const sn=g(r,"setName");const pr=parseFloat(g(r,"price").replace(/[^0-9.]/g,""));out.push({qty:parseInt(g(r,"qty"))||1,name,set:sc||(sn&&sn.length<=6&&!/\s/.test(sn)?sn:""),setName:sn&&sn!==sc?sn:"",num:g(r,"num"),pid:g(r,"pid").replace(/\D/g,""),condition:g(r,"condition"),printing:g(r,"printing"),rarity:g(r,"rarity"),price:isNaN(pr)?null:pr,game:gameFromLine(g(r,"line"))||game})}return out}

function fromText(text,game){const out=[];for(let line of text.split(/\r?\n/)){line=line.trim();if(!line||/^(\/\/|#)/.test(line))continue;let foil=false;if(/\*f\*|\(foil\)|\bfoil$/i.test(line)){foil=true;line=line.replace(/\s*(\*f\*|\(foil\)|\bfoil$)/ig,"").trim()}let m=line.match(/^(\d+)\s*x?\s+(.+?)\s+[\[(]([A-Za-z0-9]{2,8})[\])](?:\s+(\S+))?$/);const raw=line;if(m){out.push({qty:+m[1],name:m[2],set:m[3].toUpperCase(),num:m[4]||"",printing:foil?"Foil":"",game,raw});continue}m=line.match(/^(\d+)\s*x?\s+(.+)$/);if(m)out.push({qty:+m[1],name:m[2],set:"",num:"",printing:foil?"Foil":"",game,raw});else out.push({qty:1,name:line,set:"",num:"",printing:foil?"Foil":"",game,raw})}return out}

function parseAny(text,game){return looksCSV(text)?fromCSV(text,game):fromText(text,game)}

function rowKey(it){return[lc(it.name),lc(it.set),normNum(it.num),it.pid||"",lc(it.printing),lc(it.condition)].join("|")}
function ck(it){return[it.game||"auto",it.pid||"",lc(it.set),normNum(it.num),lc(cleanName(it.name))].join("|")}
function merge(base,add){const m=new Map(base.map(x=>[rowKey(x),{...x}]));for(const x of add){const k=rowKey(x);if(m.has(k))m.get(k).qty+=x.qty;else m.set(k,{...x})}return[...m.values()]}

const SRC={tcg:"TCGplayer",sf:"Scryfall",ptcg:"Pokémon TCG API",ygo:"YGOPRODeck",lor:"Lorcast"};

function tcgImg(pid){return`https://tcgplayer-cdn.tcgplayer.com/product/${pid}_in_1000x1000.jpg`}

function fromScry(c,it){const f=c.card_faces||[];const img=(c.image_uris&&c.image_uris.normal)||(f[0]&&f[0].image_uris&&f[0].image_uris.normal)||null;const back=!c.image_uris&&f[1]&&f[1].image_uris?f[1].image_uris.normal:null;const foil=/foil|etched/i.test(it.printing||"");const p=foil?(c.prices.usd_foil||c.prices.usd_etched||c.prices.usd):(c.prices.usd||c.prices.usd_foil);return{img,back,name:c.name,setName:c.set_name,setCode:c.set.toUpperCase(),num:c.collector_number,rarity:c.rarity,type:c.type_line,price:p?+p:null,link:c.scryfall_uri,source:SRC.sf,game:"mtg"}}

function nameOk(cardName,it){const a=lc(cleanName(it.name));const b=lc(cardName);return a===b||b.split(" // ").includes(a)}

async function getJSON(url,opt){const r=await fetch(url,opt);if(r.status===404)return null;if(r.status===429){await sleep(1000);return getJSON(url,opt)}if(!r.ok)throw new Error(r.status);return r.json()}

async function scryBatch(list){for(let i=0;i<list.length;i+=75){const chunk=list.slice(i,i+75);const ids=chunk.map(it=>it.set&&it.num?{set:lc(it.set),collector_number:normNum(it.num)}:it.set?{name:cleanName(it.name),set:lc(it.set)}:{name:cleanName(it.name)});try{const j=await getJSON("https://api.scryfall.com/cards/collection",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifiers:ids})});for(const c of(j&&j.data)||[]){for(const it of chunk){if(cache[ck(it)])continue;const hit=it.set&&it.num?(lc(c.set)===lc(it.set)&&lc(c.collector_number)===lc(normNum(it.num))):(nameOk(c.name,it)&&(!it.set||lc(c.set)===lc(it.set)));if(hit)setInfo(it,fromScry(c,it))}}}catch(e){}await sleep(110)}}

async function tryScryNamed(it){const u=new URL("https://api.scryfall.com/cards/named");u.searchParams.set("exact",cleanName(it.name));const c=await getJSON(u).catch(()=>null);await sleep(110);return c&&c.object==="card"?fromScry(c,it):null}

async function tryPokemon(it,strict){let q;if(it.set&&it.num)q=`set.ptcgoCode:${it.set} number:${normNum(it.num)}`;else q=`name:"${cleanName(it.name).replace(/"/g,"")}"`+(it.set?` set.ptcgoCode:${it.set}`:"");const j=await getJSON("https://api.pokemontcg.io/v2/cards?pageSize=5&q="+encodeURIComponent(q)).catch(()=>null);const c=j&&j.data&&j.data[0];if(!c)return null;if(strict&&!nameOk(c.name,it))return null;const tp=c.tcgplayer&&c.tcgplayer.prices?Object.values(c.tcgplayer.prices)[0]:null;return{img:c.images.large||c.images.small,name:c.name,setName:c.set.name,setCode:c.set.ptcgoCode||c.set.id,num:c.number,rarity:c.rarity||"",type:(c.supertype||"")+(c.subtypes?" · "+c.subtypes.join(", "):""),price:tp&&tp.market?tp.market:null,link:c.tcgplayer&&c.tcgplayer.url||null,source:SRC.ptcg,game:"pokemon"}}

async function tryYgo(it,strict){const j=await getJSON("https://db.ygoprodeck.com/api/v7/cardinfo.php?name="+encodeURIComponent(cleanName(it.name))).catch(()=>null);const c=j&&j.data&&j.data[0];if(!c)return null;if(strict&&!nameOk(c.name,it))return null;const s=(c.card_sets||[]).find(s=>it.num&&lc(s.set_code)===lc(it.num))||(c.card_sets||[]).find(s=>it.set&&lc(s.set_code).startsWith(lc(it.set)+"-"));const p=c.card_prices&&c.card_prices[0]?parseFloat(c.card_prices[0].tcgplayer_price):null;return{img:c.card_images[0].image_url,name:c.name,setName:s?s.set_name:"",setCode:s?s.set_code:(it.set||""),num:s?s.set_code:(it.num||""),rarity:s?s.set_rarity:"",type:c.type,price:p||null,link:c.ygoprodeck_url||null,source:SRC.ygo,game:"yugioh"}}

async function tryLorcana(it,strict){const j=await getJSON("https://api.lorcast.com/v0/cards/search?q="+encodeURIComponent(cleanName(it.name))).catch(()=>null);const list=(j&&j.results)||[];const full=c=>c.version?`${c.name} - ${c.version}`:c.name;const want=lc(cleanName(it.name));let c=list.find(c=>lc(full(c))===want&&(!it.num||normNum(c.collector_number)===normNum(it.num)))||list.find(c=>lc(full(c))===want);if(!c&&!strict)c=list[0];if(!c)return null;const iu=c.image_uris&&c.image_uris.digital;return{img:iu?(iu.normal||iu.large||iu.small):null,name:full(c),setName:c.set&&c.set.name||"",setCode:c.set&&c.set.code||"",num:c.collector_number,rarity:c.rarity||"",type:(c.type||[]).join(" · "),price:c.prices&&c.prices.usd?+c.prices.usd:null,link:null,source:SRC.lor,game:"lorcana"}}

async function fallback(it){const g=it.game||"auto";const chain=g==="mtg"?[()=>tryScryNamed(it)]:g==="pokemon"?[()=>tryPokemon(it,false)]:g==="yugioh"?[()=>tryYgo(it,false)]:g==="lorcana"?[()=>tryLorcana(it,false)]:g==="other"?[]:[()=>tryScryNamed(it),()=>tryPokemon(it,true),()=>tryYgo(it,true),()=>tryLorcana(it,true)];for(const f of chain){const r=await f();if(r&&r.img)return r}return null}

function setInfo(it,info){cache[ck(it)]=info;saveCache();progress.done++;updateTile(it);renderStatus()}

async function pool(list,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length){const it=list[i++];await fn(it)}}))}

async function resolveAll(){const todo=[];const seen=new Set();for(const it of items){const k=ck(it);if(cache[k]||seen.has(k))continue;seen.add(k);todo.push(it)}progress={done:0,total:todo.length,running:todo.length>0};renderStatus();if(!todo.length)return;const rest=[];for(const it of todo){if(it.pid)setInfo(it,{img:tcgImg(it.pid),name:it.name,setName:it.setName||"",setCode:it.set,num:it.num,rarity:it.rarity,price:it.price,link:`https://www.tcgplayer.com/product/${it.pid}`,source:SRC.tcg,game:it.game||""});else rest.push(it)}const mtg=rest.filter(it=>(it.game==="mtg"||it.game==="auto"||!it.game));await scryBatch(mtg);const left=rest.filter(it=>!cache[ck(it)]);await pool(left,3,async it=>{const r=await fallback(it).catch(()=>null);setInfo(it,r||{miss:true})});progress.running=false;renderStatus();renderAll()}

function infoOf(it){return cache[ck(it)]||null}
function priceOf(it){const i=infoOf(it);return it.price!=null?it.price:(i&&i.price!=null?i.price:null)}
function rarityOf(it){const i=infoOf(it);return(it.rarity||(i&&i.rarity)||"").toString()}
function money(n){return n==null?"":"$"+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):""}

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

function artNode(it,large){const i=infoOf(it);const art=el("div","art");const ph=()=>{const p=el("div","ph");p.append(el("b",null,cleanName(it.name)));const s=el("div");s.append(el("small",null,[it.set,normNum(it.num)].filter(Boolean).join(" · ")||"No set"));if(i&&i.miss){s.append(document.createElement("br"));s.append(el("em",null,"No image found"))}p.append(s);return p};if(!i){art.append(ph());art.append(el("div","shimmer"))}else if(i.miss||!i.img)art.append(ph());else{const img=new Image();img.alt=i.name||it.name;img.decoding="async";if(!large)img.loading="lazy";img.referrerPolicy="no-referrer";img.onerror=()=>{img.remove();art.prepend(ph())};img.src=i.img;art.append(img)}if(!large&&it.qty>1)art.append(el("span","qty","×"+it.qty));if(!large&&/foil|holo|etched/i.test(it.printing||""))art.append(el("span","foil","FOIL"));return art}

function tileNode(it){const b=el("button","tile");b.type="button";b.append(artNode(it));const m=el("div","meta");m.append(el("span","nm",cleanName(it.name)));const s=el("span","sub");s.append(el("span",null,[it.set,normNum(it.num)].filter(Boolean).join(" · ")));s.append(el("span",null,money(priceOf(it))));m.append(s);b.append(m);b.onclick=()=>openDetail(it);return b}

function updateTile(it){const k=ck(it);for(const x of items||[]){if(ck(x)!==k)continue;const t=tiles.get(rowKey(x));if(t){const n=tileNode(x);t.replaceWith(n);tiles.set(rowKey(x),n)}}}

function filtered(){const q=lc($("#q").value.trim());const fs=$("#fSet").value;const fr=$("#fRarity").value;const miss=$("#missing").checked;let l=(items||[]).filter(it=>{const i=infoOf(it);if(q&&!(lc(it.name).includes(q)||lc(it.set).includes(q)||lc(i&&i.setName).includes(q)))return false;if(fs&&it.set!==fs)return false;if(fr&&lc(rarityOf(it))!==fr)return false;if(miss&&!(i&&i.miss))return false;return true});const s=$("#sort").value;const numv=n=>{const m=String(n||"").match(/\d+/);return m?+m[0]:1e9};const by={name:(a,b)=>cleanName(a.name).localeCompare(cleanName(b.name)),set:(a,b)=>(a.set||"").localeCompare(b.set||"")||numv(a.num)-numv(b.num)||a.name.localeCompare(b.name),price:(a,b)=>(priceOf(b)??-1)-(priceOf(a)??-1),qty:(a,b)=>b.qty-a.qty||a.name.localeCompare(b.name)};return l.sort(by[s])}

function fillFilters(){const sets=[...new Set((items||[]).map(it=>it.set).filter(Boolean))].sort();const rs=[...new Set((items||[]).map(it=>lc(rarityOf(it))).filter(Boolean))].sort();const keep=(sel,vals,label,fmt)=>{const v=sel.value;sel.replaceChildren(new Option(label,""),...vals.map(x=>new Option(fmt(x),x)));sel.value=vals.includes(v)?v:""};keep($("#fSet"),sets,"All sets",x=>x);keep($("#fRarity"),rs,"All rarities",cap)}

function renderStats(){const it=items||[];const total=it.reduce((s,x)=>s+x.qty,0);const val=it.reduce((s,x)=>{const p=priceOf(x);return p!=null?s+p*x.qty:s},0);const miss=it.filter(x=>{const i=infoOf(x);return i&&i.miss}).length;const st=$("#stats");st.replaceChildren();const add=(v,l)=>{const d=el("div","stat");d.append(el("b",null,v),el("small",null,l));st.append(d)};add(total.toLocaleString(),"Cards");add(it.length.toLocaleString(),"Unique");add(money(val)||"$0.00","Est. value");if(miss)add(String(miss),"Unmatched")}

function renderStatus(){const s=$("#status");s.replaceChildren();if(!items||!items.length)return;if(progress.running){s.append(el("div",null,`Finding images… ${progress.done} of ${progress.total}`));const b=el("div","bar");const i=el("i");i.style.width=(progress.total?progress.done/progress.total*100:0)+"%";b.append(i);s.append(b)}else{const shown=filtered().length;s.append(el("div",null,`Showing ${shown} of ${items.length} cards`))}renderStats()}

function renderAll(){fillFilters();const g=$("#grid");g.className="grid"+(view==="list"?" list":"");tiles.clear();g.replaceChildren();if(!items||!items.length){g.append(el("div","empty","Paste or drop an export above, then press Show these cards."));renderStats();renderStatus();return}const list=filtered();if(!list.length){g.append(el("div","empty","No cards match these filters."))}const frag=document.createDocumentFragment();for(const it of list){const t=tileNode(it);tiles.set(rowKey(it),t);frag.append(t)}g.append(frag);renderStatus()}

function openDetail(it){const d=$("#dlg");const i=infoOf(it)||{};d.replaceChildren();const w=el("div","dlg");const left=el("div");let showBack=false;const artWrap=el("div");const drawArt=()=>{artWrap.replaceChildren();if(showBack&&i.back){const a=el("div","art");const img=new Image();img.src=i.back;img.alt=i.name+" back face";a.append(img);artWrap.append(a)}else artWrap.append(artNode(it,true))};drawArt();left.append(artWrap);if(i.back){const fb=el("button",null,"Flip card");fb.style.marginTop="10px";fb.onclick=()=>{showBack=!showBack;drawArt()};left.append(fb)}const right=el("div");const x=el("button","x","Close");x.onclick=()=>d.close();right.append(x);right.append(el("h2",null,i.name||cleanName(it.name)));right.append(el("div","src",i.source?"Image: "+i.source:(i.miss?"No match found":"Looking up…")));const dl=el("dl");const row=(k,v)=>{if(v==null||v==="")return;dl.append(el("dt",null,k),el("dd",null,String(v)))};row("Quantity",it.qty);row("Set",[i.setName||it.setName,it.set&&`(${it.set})`].filter(Boolean).join(" "));row("Number",it.num||i.num);row("Rarity",cap(rarityOf(it)));row("Type",i.type);row("Printing",it.printing);row("Condition",it.condition);row("Price each",money(priceOf(it)));if(priceOf(it)!=null&&it.qty>1)row("Line total",money(priceOf(it)*it.qty));row("Export line",it.raw);right.append(dl);const links=el("div","row");const a1=el("a",null,"Search on TCGplayer");a1.href="https://www.tcgplayer.com/search/all/product?q="+encodeURIComponent(cleanName(it.name));a1.target="_blank";a1.rel="noopener";links.append(a1);if(i.link){const a2=el("a",null,"View on "+(i.source===SRC.tcg?"TCGplayer":i.source));a2.href=i.link;a2.target="_blank";a2.rel="noopener";links.append(a2)}right.append(links);w.append(left,right);d.append(w);d.showModal()}
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

function load(text,mode){const game=$("#game").value;const parsed=parseAny(text,game);if(!parsed.length){$("#status").textContent="Nothing to import. Each line should look like: 1 Card Name [SET] 123";return}items=mode==="add"&&items?merge(items,parsed):merge([],parsed);store.set("binder.items",items);$("#importPanel").open=false;renderAll();resolveAll()}

$("#replace").onclick=()=>load($("#paste").value,"replace");
$("#add").onclick=()=>load($("#paste").value,"add");
$("#clear").onclick=()=>{items=[];store.set("binder.items",items);$("#importPanel").open=true;renderAll()};
async function readFiles(files){const texts=await Promise.all([...files].map(f=>f.text()));$("#paste").value=texts.join("\n")}
$("#file").onchange=async e=>{if(e.target.files.length){await readFiles(e.target.files);e.target.value=""}};
const drop=$("#drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>{if(e.dataTransfer.files.length)readFiles(e.dataTransfer.files)});
["q","fSet","fRarity","sort","missing"].forEach(id=>$("#"+id).addEventListener("input",renderAll));
const setView=v=>{view=v;store.set("binder.view",v);$("#vGrid").setAttribute("aria-pressed",v==="grid");$("#vList").setAttribute("aria-pressed",v==="list");renderAll()};
$("#vGrid").onclick=()=>setView("grid");
$("#vList").onclick=()=>setView("list");

if(items&&items.length){$("#importPanel").open=false;setView(view);resolveAll()}else{setView(view);load($("#paste").value,"replace")}
</script>
</body>
</html>
